<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akaryakıt Yönetim Paneli</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 420px; }
        h2 { margin-top: 0; font-size: 20px; color: #38bdf8; text-align: center; margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #94a3b8; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; margin-bottom: 14px; outline: none; font-family: inherit; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { width: 100%; background: #2563eb; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .logout-btn { background: #475569; margin-top: 10px; }
        .logout-btn:hover { background: #334155; }
        #loginScreen, #adminPanel { display: none; }
        .msg { font-size: 13px; font-weight: bold; text-align: center; margin-top: 12px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <!-- GİRİŞ EKRANI -->
        <div id="loginScreen">
            <h2>🔐 Yönetici Girişi</h2>
            <label>Yönetici Şifresi</label>
            <input type="password" id="adminPass" placeholder="Şifrenizi girin">
            <button onclick="checkLogin()">Giriş Yap</button>
            <div id="loginMsg" class="msg"></div>
        </div>

        <!-- YÖNETİM PANELİ -->
        <div id="adminPanel">
            <h2>📢 Duyuru / Zam Ekle</h2>
            <label>Duyuru Başlığı</label>
            <input type="text" id="newsTitle" placeholder="Örn: Benzine Zam Geldi!">
            
            <label>Duyuru İçeriği</label>
            <textarea id="newsContent" rows="4" placeholder="Örn: Yarından itibaren geçerli olmak üzere..."></textarea>
            
            <button onclick="publishNews()">Duyuruyu Yayınla 🚀</button>
            <div id="newsMsg" class="msg"></div>

            <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "123";

        window.onload = function() {
            const isAuth = sessionStorage.getItem("isAdminAuth");
            if (isAuth === "true") {
                showPanel();
            } else {
                document.getElementById("loginScreen").style.display = "block";
            }
        };

        function checkLogin() {
            const pass = document.getElementById("adminPass").value;
            const msg = document.getElementById("loginMsg");

            if (pass === ADMIN_PASSWORD) {
                sessionStorage.setItem("isAdminAuth", "true");
                showPanel();
            } else {
                msg.textContent = "Hatalı şifre!";
                msg.className = "msg error";
            }
        }

        function showPanel() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
        }

        function logout() {
            sessionStorage.removeItem("isAdminAuth");
            location.reload();
        }

        function publishNews() {
            const title = document.getElementById("newsTitle").value.trim();
            const content = document.getElementById("newsContent").value.trim();
            const msg = document.getElementById("newsMsg");

            if (!title || !content) {
                msg.textContent = "Lütfen başlık ve içerik alanlarını doldurun.";
                msg.className = "msg error";
                return;
            }

            try {
                // Duyuruyu tarayıcı hafızasına kaydediyoruz
                const newsData = { title: title, content: content, date: new Date().toISOString() };
                localStorage.setItem("activeNews", JSON.stringify(newsData));

                msg.textContent = "✅ Duyuru başarıyla yayınlandı!";
                msg.className = "msg success";
                document.getElementById("newsTitle").value = "";
                document.getElementById("newsContent").value = "";
            } catch (err) {
                msg.textContent = "Yayınlama hatası oluştu.";
                msg.className = "msg error";
            }
        }
    </script>
</body>
</html>
