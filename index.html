<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afyon Akaryakıt Fiyatları</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">
    
    <!-- Leaflet Harita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #1976d2;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        #map {
            height: 320px;
            width: 100%;
        }
        .container {
            padding: 15px;
        }
        .station-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .station-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .prices {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            background: #f0f4f8;
            padding: 8px;
            border-radius: 5px;
        }
        .price-item {
            text-align: center;
        }
        .price-title {
            font-size: 12px;
            color: #666;
        }
        .price-val {
            font-weight: bold;
            color: #d32f2f;
        }
        .nav-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #388e3c;
            color: white;
            padding: 12px 0;
            margin-top: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>Afyon Akaryakıt İstasyonları</header>
    
    <!-- HARİTA BÖLÜMÜ -->
    <div id="map"></div>

    <div class="container" id="stations-list">
        <p style="text-align:center; color:#666;">İstasyonlar yükleniyor...</p>
    </div>

    <!-- Leaflet JS & Supabase Client -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://dzapuhihjzdmzvwzcxht.supabase.co";
        const SUPABASE_KEY = "sb_publishable_atDC1UU40N7N-U-c3u__4A_mKuI2Oum";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Haritayı Afyonkarahisar merkezli başlat
        const map = L.map('map').setView([38.7569, 30.5387], 12);

        // Engellenmeyen CARTO Katmanı (Hızlı ve Temiz Görünüm)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Doğrudan Haritalar Uygulamasını ve Navigasyonu Başlatan Fonksiyon
        function openNativeMaps(lat, lng) {
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                // Play Store yerine doğrudan Haritalar uygulamasında rotayı açar
                window.location.href = `intent://maps.google.com/maps?daddr=${lat},${lng}#Intent;scheme=https;package=com.google.android.apps.maps;end`;
            } else {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
            }
        }

        async function loadStations() {
            const { data: stations, error } = await supabaseClient.from('stations').select('*');
            const listContainer = document.getElementById('stations-list');
            
            if (error) {
                console.error("Supabase Hatası:", error);
                listContainer.innerHTML = '<p style="text-align:center; color:red;">Veriler yüklenirken hata oluştu!</p>';
                return;
            }

            if (!stations || stations.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#666;">Henüz eklenmiş istasyon bulunamadı.</p>';
                return;
            }

            listContainer.innerHTML = '';

            stations.forEach(station => {
                const lat = station.latitude || 38.7569;
                const lng = station.longitude || 30.5387;
                const name = station.name || 'Akaryakıt İstasyonu';

                // Haritaya Pin Ekle
                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`<b>${name}</b><br>Benzin: ₺${station.benzin || '-'}<br><button onclick="openNativeMaps(${lat}, ${lng})" style="margin-top:5px; background:#388e3c; color:white; border:none; padding:5px 10px; border-radius:3px;">Yol Tarifi Al</button>`);

                // Liste Kartı Oluştur
                const card = document.createElement('div');
                card.className = 'station-card';
                card.innerHTML = `
                    <div class="station-name">${name}</div>
                    <div style="font-size:12px; color:#777; margin-top:3px;">${station.address || 'Afyonkarahisar'}</div>
                    <div class="prices">
                        <div class="price-item"><div class="price-title">BENZİN</div><div class="price-val">₺${station.benzin || '-'}</div></div>
                        <div class="price-item"><div class="price-title">MOTORİN</div><div class="price-val">₺${station.motorin || '-'}</div></div>
                        <div class="price-item"><div class="price-title">LPG</div><div class="price-val">₺${station.lpg || '-'}</div></div>
                    </div>
                    <button class="nav-btn" onclick="openNativeMaps(${lat}, ${lng})">
                       📍 Google Haritalar'da Yol Tarifi Al
                    </button>
                `;
                listContainer.appendChild(card);
            });
        }

        loadStations();
    </script>
</body>
</html>
