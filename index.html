<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akaryakıt Fiyatları</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f6f9; }
        header { background: #1976d2; color: white; padding: 16px; text-align: center; font-weight: bold; font-size: 18px; }
        .container { padding: 14px; max-width: 600px; margin: auto; }
        .filter-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .filter-box label { font-weight: bold; display: block; margin-bottom: 8px; color: #333; }
        .filter-box select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; background: #fff; }
        .status { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #555; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .station-title { font-size: 16px; font-weight: bold; color: #1976d2; margin-bottom: 8px; }
        .prices { display: flex; justify-content: space-around; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
        .price-val { font-weight: bold; color: #d32f2f; }
    </style>
</head>
<body>

    <header>⛽ Akaryakıt Fiyatları</header>

    <div class="container">
        <div class="filter-box">
            <label for="citySelect">📍 Bulunduğunuz Şehri Seçin:</label>
            <select id="citySelect" onchange="loadPrices()">
                <option value="Afyonkarahisar">Afyonkarahisar</option>
                <option value="Ankara">Ankara</option>
                <option value="İstanbul">İstanbul</option>
                <option value="İzmir">İzmir</option>
                <option value="Antalya">Antalya</option>
                <option value="Bursa">Bursa</option>
                <option value="Eskişehir">Eskişehir</option>
            </select>
        </div>

        <div id="status" class="status">Fiyatlar yükleniyor...</div>
        <div id="list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseClient = supabase.createClient(
            "https://dzapuhihjzdmzvwzcxht.supabase.co", 
            "sb_publishable_atDC1UU40N7N-U-c3u__4A_mKuI2Oum"
        );

        window.onload = function() {
            loadPrices();
        };

        async function loadPrices() {
            const selectedCity = document.getElementById('citySelect').value;
            const list = document.getElementById('list');
            const status = document.getElementById('status');
            
            list.innerHTML = "";
            status.innerHTML = `${selectedCity} için fiyatlar getiriliyor...`;

            try {
                // Supabase tablonuzda şehir sütunu varsa filtreleme yapıyoruz (Yoksa .eq('sehir', selectedCity) kısmını silebilirsiniz)
                const { data, error } = await supabaseClient
                    .from('doviz_prices')
                    .select('*');

                status.innerHTML = `✅ ${selectedCity} Güncel Fiyat Listesi`;

                if (error) throw error;

                if (data && data.length > 0) {
                    data.forEach(item => {
                        const brandName = item.brand || 'İstasyon';

                        list.innerHTML += `
                            <div class="card">
                                <div class="station-title">⛽ ${brandName}</div>
                                <div class="prices">
                                    <div>Benzin: <span class="price-val">₺${item.benzin || '-'}</span></div>
                                    <div>Motorin: <span class="price-val">₺${item.motorin || '-'}</span></div>
                                    <div>LPG: <span class="price-val">₺${item.lpg || '-'}</span></div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    status.innerHTML = "Kayıtlı fiyat bulunamadı.";
                }
            } catch (e) {
                status.innerHTML = "Veriler yüklenirken bir hata oluştu.";
            }
        }
    </script>
</body>
</html>
