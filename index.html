<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akaryakıt Fiyatları & En Yakın İstasyonlar</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">
    
    <!-- Leaflet Harita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #1976d2;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        #map {
            height: 300px;
            width: 100%;
        }
        .container {
            padding: 15px;
        }
        .station-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .station-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .station-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .distance-tag {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .prices {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            background: #f0f4f8;
            padding: 8px;
            border-radius: 5px;
        }
        .price-item {
            text-align: center;
        }
        .price-title {
            font-size: 11px;
            color: #666;
        }
        .price-val {
            font-weight: bold;
            color: #d32f2f;
            font-size: 14px;
        }
        .nav-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #388e3c;
            color: white;
            padding: 12px 0;
            margin-top: 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>Akaryakıt İstasyonları</header>
    
    <!-- HARİTA BÖLÜMÜ -->
    <div id="map"></div>

    <div class="container" id="stations-list">
        <p style="text-align:center; color:#666;">Konumunuz alınıyor ve en yakın istasyonlar hesaplanıyor...</p>
    </div>

    <!-- Leaflet JS & Supabase Client -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://dzapuhihjzdmzvwzcxht.supabase.co";
        const SUPABASE_KEY = "sb_publishable_atDC1UU40N7N-U-c3u__4A_mKuI2Oum";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userLat = 38.7569; // Varsayılan Afyonkarahisar
        let userLng = 30.5387;

        // Haritayı başlat
        const map = L.map('map').setView([userLat, userLng], 12);

        // ESRI Harita Katmanı (API Anahtarı gerektirmez ve engellenmez)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Haversine Formülü ile İki Nokta Arasındaki Mesafeyi Hesaplama (KM cinsinden)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Dünya yarıçapı
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Doğrudan Google Haritalar Uygulamasını ve Rotayı Açan Fonksiyon
        function openNativeMaps(lat, lng) {
            const isAndroid = /Android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                // Android'de Google Haritalar uygulamasını rota modunda tetikler
                window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            } else {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`, '_blank');
            }
        }

        async function loadStations() {
            const { data: stations, error } = await supabaseClient.from('stations').select('*');
            const listContainer = document.getElementById('stations-list');
            
            if (error) {
                console.error("Supabase Hatası:", error);
                listContainer.innerHTML = '<p style="text-align:center; color:red;">Veriler yüklenirken hata oluştu!</p>';
                return;
            }

            if (!stations || stations.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#666;">Henüz eklenmiş istasyon bulunamadı.</p>';
                return;
            }

            // Her istasyon için mesafeyi hesapla
            stations.forEach(station => {
                const lat = station.latitude || 38.7569;
                const lng = station.longitude || 30.5387;
                station.distance = calculateDistance(userLat, userLng, lat, lng);
            });

            // En yakından en uzağa doğru sırala
            stations.sort((a, b) => a.distance - b.distance);

            listContainer.innerHTML = '';

            stations.forEach(station => {
                const lat = station.latitude || 38.7569;
                const lng = station.longitude || 30.5387;
                const name = station.name || 'Akaryakıt İstasyonu';
                const distStr = station.distance < 1 ? 
                    `${Math.round(station.distance * 1000)} m` : 
                    `${station.distance.toFixed(1)} km`;

                // Haritaya Pin Ekle
                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`
                    <b>${name}</b><br>
                    Mesafe: ${distStr}<br>
                    Benzin: ₺${station.benzin || '-'}<br>
                    <button onclick="openNativeMaps(${lat}, ${lng})" style="margin-top:5px; background:#388e3c; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">Rota Başlat</button>
                `);

                // Liste Kartı Oluştur
                const card = document.createElement('div');
                card.className = 'station-card';
                card.innerHTML = `
                    <div class="station-header">
                        <div class="station-name">${name}</div>
                        <div class="distance-tag">📍 ${distStr}</div>
                    </div>
                    <div style="font-size:12px; color:#777; margin-top:3px;">${station.address || 'Afyonkarahisar'}</div>
                    <div class="prices">
                        <div class="price-item"><div class="price-title">BENZİN</div><div class="price-val">₺${station.benzin || '-'}</div></div>
                        <div class="price-item"><div class="price-title">MOTORİN</div><div class="price-val">₺${station.motorin || '-'}</div></div>
                        <div class="price-item"><div class="price-title">LPG</div><div class="price-val">₺${station.lpg || '-'}</div></div>
                    </div>
                    <button class="nav-btn" onclick="openNativeMaps(${lat}, ${lng})">
                       🚀 Google Haritalar'da Rota Çiz
                    </button>
                `;
                listContainer.appendChild(card);
            });
        }

        // Kullanıcı Konumunu Al
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    
                    // Haritayı kullanıcının konumuna kaydır ve kendi konum pini ekle
                    map.setView([userLat, userLng], 13);
                    L.circle([userLat, userLng], {
                        color: '#1976d2',
                        fillColor: '#2196f3',
                        fillOpacity: 0.5,
                        radius: 200
                    }).addTo(map).bindPopup("Mevcut Konumunuz");

                    loadStations();
                },
                (error) => {
                    console.warn("Konum izni alınamadı, varsayılan merkez kullanılıyor.");
                    loadStations();
                }
            );
        } else {
            loadStations();
        }
    </script>
</body>
</html>
