<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Yakın Akaryakıt İstasyonları</title>
    <!-- Leaflet Harita Kütüphanesi CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        header { background: #d9534f; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #map { height: 40vh; width: 100%; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        button { background: #d9534f; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 15px; }
        button:hover { background: #c9302c; }
        .station-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .station-name { font-weight: bold; font-size: 16px; color: #333; }
        .station-dist { color: #666; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <header>⛽ Yakınımdaki Akaryakıt İstasyonları</header>

    <!-- Harita Alanı -->
    <div id="map"></div>

    <div class="container">
        <button onclick="getFuelStations()">Konumuma Göre Benzinlikleri Bul</button>
        <div id="results">Butona basarak çevrenizdeki istasyonları listeleyebilirsiniz.</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Haritayı başlat
        let map = L.map('map').setView([38.9637, 35.2433], 6); // Varsayılan Türkiye merkezi
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userMarker, stationMarkers = [];

        function getFuelStations() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "Konumunuz alınıyor ve istasyonlar aranıyor...";

            if (!navigator.geolocation) {
                alert("Tarayıcınız konum özelliğini desteklemiyor.");
                return;
            }

            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                // Haritayı kullanıcının konumuna odakla
                map.setView([lat, lon], 14);

                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.marker([lat, lon]).addTo(map).bindPopup("Buradasınız").openPopup();

                // OpenStreetMap Overpass API sorgusu (5 km yarıçap içinde benzinlikler)
                const radius = 5000; // 5 kilometre
                const query = `[out:json];node["amenity"="fuel"](around:${radius},${lat},${lon});out;`;
                const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

                fetch(url)
                    .then(response => response.json())
                    .then(data => {
                        resultsDiv.innerHTML = "";
                        
                        // Önceki pinleri temizle
                        stationMarkers.forEach(m => map.removeLayer(m));
                        stationMarkers = [];

                        if (data.elements.length === 0) {
                            resultsDiv.innerHTML = "Yakınınızda 5 km içinde kayıtlı benzinlik bulunamadı.";
                            return;
                        }

                        // İstasyonları kullanıcıya olan mesafelerine göre sıralayalım
                        let stations = data.elements.map(station => {
                            let sLat = station.lat;
                            let sLon = station.lon;
                            let name = station.tags.name || "İsimsiz Akaryakıt İstasyonu";
                            let brand = station.tags.brand ? ` (${station.tags.brand})` : "";
                            
                            let dist = calculateDistance(lat, lon, sLat, sLon);
                            return { name: name + brand, lat: sLat, lon: sLon, distance: dist };
                        });

                        stations.sort((a, b) => a.distance - b.distance);

                        // Listeye ve haritaya ekle
                        stations.forEach(st => {
                            // Listeye ekleme
                            let card = document.createElement('div');
                            card.className = 'station-card';
                            card.innerHTML = `<div class="station-name">${st.name}</div>
                                              <div class="station-dist">Mesafe: ${st.distance.toFixed(2)} km</div>`;
                            resultsDiv.appendChild(card);

                            // Haritaya pin ekleme
                            let marker = L.marker([st.lat, st.lon]).addTo(map)
                                .bindPopup(`<b>${st.name}</b><br>Mesafe: ${st.distance.toFixed(2)} km`);
                            stationMarkers.push(marker);
                        });

                    })
                    .catch(err => {
                        console.error(err);
                        resultsDiv.innerHTML = "Veriler çekilirken bir hata oluştu.";
                    });

            }, error => {
                alert("Konum izni reddedildi veya alınamadı.");
                resultsDiv.innerHTML = "Konum alınamadığı için arama yapılamadı.";
            });
        }

        // İki koordinat arası kilometre hesaplama (Haversine Formülü)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Dünya'nın yarıçapı (km)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
    </script>
</body>
</html>
