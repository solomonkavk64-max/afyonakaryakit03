<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akaryakıt Bulucu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f6f9; }
        header { background: #1976d2; color: white; padding: 14px; text-align: center; font-weight: bold; }
        #map { height: 250px; width: 100%; }
        .container { padding: 12px; }
        .gps-btn { width: 100%; background: #d32f2f; color: white; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .status { text-align: center; font-size: 13px; font-weight: bold; margin-bottom: 10px; }
        .card { background: white; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .prices { display: flex; justify-content: space-around; background: #f8f9fa; padding: 8px; border-radius: 6px; margin-top: 8px; }
        .price-val { font-weight: bold; color: #d32f2f; }
        .nav-btn { display: block; width: 100%; background: #2e7d32; color: white; padding: 10px; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <header>⛽ Akaryakıt İstasyonları</header>
    <div id="map"></div>

    <div class="container">
        <button class="gps-btn" onclick="getLocation()">📍 Konumu Sabitle ve Getir</button>
        <div id="status" class="status">Konum bekleniyor...</div>
        <div id="list"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseClient = supabase.createClient(
            "https://dzapuhihjzdmzvwzcxht.supabase.co", 
            "sb_publishable_atDC1UU40N7N-U-c3u__4A_mKuI2Oum"
        );

        let map = null;
        let marker = null;

        window.onload = function() {
            initMap(38.7569, 30.5387);
            getLocation();
        };

        function initMap(lat, lng) {
            if (!map) {
                map = L.map('map').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19
                }).addTo(map);
            } else {
                map.setView([lat, lng], 16);
            }

            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                marker = L.marker([lat, lng]).addTo(map).bindPopup("Seçilen Konum");
            }
        }

        function getLocation() {
            const status = document.getElementById('status');
            status.innerHTML = "Konum alınıyor...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lng = pos.coords.longitude;
                        status.innerHTML = `✅ Konum Sabitlendi: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                        status.style.color = "#2e7d32";
                        
                        initMap(lat, lng);
                        loadPrices(lat, lng);
                    },
                    (err) => {
                        status.innerHTML = "⚠️ Konum alınamadı, varsayılan merkez kullanılıyor.";
                        status.style.color = "#d32f2f";
                        loadPrices(38.7569, 30.5387);
                    },
                    { enableHighAccuracy: false, timeout: 10000 }
                );
            }
        }

        async function loadPrices(lat, lng) {
            const list = document.getElementById('list');
            list.innerHTML = "Fiyatlar yükleniyor...";

            try {
                const { data } = await supabaseClient.from('doviz_prices').select('*');
                list.innerHTML = '';

                if (data && data.length > 0) {
                    data.forEach(item => {
                        list.innerHTML += `
                            <div class="card">
                                <b>${item.brand || 'İstasyon'}</b>
                                <div class="prices">
                                    <div>Benzin: <span class="price-val">₺${item.benzin || '-'}</span></div>
                                    <div>Motorin: <span class="price-val">₺${item.motorin || '-'}</span></div>
                                    <div>LPG: <span class="price-val">₺${item.lpg || '-'}</span></div>
                                </div>
                                <a class="nav-btn" href="https://yandex.com.tr/harita/?rtext=~${lat},${lng}&rtt=auto" target="_blank">🚀 Yandex ile Rota Başlat</a>
                            </div>
                        `;
                    });
                } else {
                    list.innerHTML = "Kayıtlı fiyat bulunamadı.";
                }
            } catch (e) {
                list.innerHTML = "Bağlantı hatası.";
            }
        }
    </script>
</body>
</html>
